name: CI Checks

on:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ANON_KEY: "test"
      SUPABASE_URL: "https://test.supabase.co"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --no-watch