<div class="page">
  <a routerLink="/" class="back-link">← Home</a>
  <h2>Gestisci collezioni</h2>

  <app-collection-create-form
    #createForm
    (create)="onCreate($event, createForm)"
  />

  @if (message()) {
    <p class="status error">{{ message() }}</p>
  }

  @if (loading()) {
    <p class="status">Caricamento...</p>
  } @else if (collections().length === 0) {
    <p class="status">Nessuna collezione ancora.</p>
  } @else {
    <ul class="collection-list">
      @for (collection of collections(); track collection.id) {
        <app-collection-list-item
          [collection]="collection"
          (rename)="onRename($event)"
          (typeChange)="onTypeChange($event, confirmDialog)"
          (deleteRequest)="onDeleteRequest($event, confirmDialog)"
        />
      }
    </ul>
  }
</div>

<app-confirm-dialog #confirmDialog />
