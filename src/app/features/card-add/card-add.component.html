<div class="page">
  <a routerLink="/" class="back-link">&larr; Home</a>
  <h2>Aggiungi carte</h2>

  <div class="tabs">
    <button
      type="button"
      [class.active]="activeTab() === 'single'"
      (click)="setTab('single')"
    >
      Carta singola
    </button>
    <button
      type="button"
      [class.active]="activeTab() === 'bulk'"
      (click)="setTab('bulk')"
    >
      Carte multiple
    </button>
  </div>

  @if (activeTab() === 'single') {
    <app-single-card-form />
  } @else {
    <app-bulk-card-form />
  }
</div>
